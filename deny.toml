# SPDX-License-Identifier: GPL-3.0-only
# `cargo deny check` — OpenDelay is GPL-3.0-only, so every dependency must be
# under a GPL-3.0-compatible licence.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    # Not in the project's original list but GPL-3.0-compatible per the FSF:
    # Boost (Slint's Windows clipboard: clipboard-win, error-code) and the
    # Unlicense (ksni, Slint's Linux tray backend).
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are GPL-3.0-only and never published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # ttf-parser is unmaintained; it is pulled in by Slint's font stack and has
    # no maintained drop-in replacement there yet. Not a vulnerability.
    "RUSTSEC-2026-0192",
]
