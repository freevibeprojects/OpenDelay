[package]
name = "opendelay"
description = "OpenDelay desktop application: local RTMP relay with a switchable broadcast delay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
opendelay-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
sys-locale = "0.3"
# Only what the app uses: winit (X11 + Wayland / Win32), the software renderer
# (CPU only: no GPU driver memory, works in VMs and remote desktops),
# AccessKit, the native tray, and the mandatory compat flag.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "system-tray",
] }
global-hotkey = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Tray-host detection and the Wayland GlobalShortcuts portal (already used by Slint's tray).
zbus = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }

[build-dependencies]
# No compile-time software-renderer resources: the embedded fonts are rasterized at runtime.
slint-build = { version = "1.18", default-features = false, features = ["compat-1-18"] }

[features]
# Developer tool: render the UI offscreen (see examples/screenshot.rs).
screenshot = ["slint/software-renderer-systemfonts"]

[[example]]
name = "screenshot"
required-features = ["screenshot"]
