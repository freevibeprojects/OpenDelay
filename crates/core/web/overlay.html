<!-- On-stream overlay for an OBS Browser source. Parameters: ?lang=<code>,
     ?color=<palette name>, ?scale=1.5, ?preview=1 (visible background, always shown). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDelay overlay</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/overlay.css">
</head>
<body>
<div id="wrap">
  <div class="badge hidden" id="badge" role="status" aria-live="polite">
    <span class="value" id="value"></span>
    <div class="progress" id="progress"></div>
  </div>
</div>
<script src="/assets/common.js"></script>
<script src="/assets/overlay.js"></script>
</body>
</html>
