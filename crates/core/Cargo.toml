# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "opendelay-core"
description = "OpenDelay relay, delay engine, settings and local control API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
opendelay-rtmp = { path = "../rtmp" }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
if-addrs = "0.15"
getrandom = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring"] }
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["signal"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
